name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'cli/src/**'
      - 'adapters/ts/src/**'
      - 'scripts/site-demo.mjs'
      - 'scripts/stress-project.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The docs generator reads `buckets --help` from the built CLI.
      - run: npm run build
      # Generates the reference pages and builds the docs into site/docs/.
      - run: npm run docs:build
      # Generates a large project with git history and exports its inspect page into site/demo/index.html.
      - run: node scripts/site-demo.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
