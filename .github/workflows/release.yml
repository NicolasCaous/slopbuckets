name: Release

# Publishes the CLI to npm when a tag like v0.1.0 is pushed.
# Uses npm trusted publishing, so the repository stores no npm token.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches the package version
        run: |
          version="v$(node -p "require('./cli/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match cli/package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm publish --workspace cli
